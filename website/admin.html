<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CADSwarm Waitlist Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #0a0a0a; --surface: #121212; --line: rgba(244,243,241,.10); --line-strong: rgba(244,243,241,.18);
  --text: #f4f3f1; --body: #d4d2cd; --muted: #8f8d88; --bone: #e8e2d4; --err: #f0a29d;
  --font-body: 'DM Sans', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--body); font: 15px/1.5 var(--font-body); }
[hidden] { display: none !important; }
main { max-width: 1240px; margin: 0 auto; padding: 48px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 28px; }
h1 { margin: 0; color: var(--text); font-weight: 500; font-size: 32px; letter-spacing: -.03em; }
.muted { color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
input { flex: 1 1 280px; font: 14px var(--font-mono); color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; padding: 11px 14px; }
input:focus { outline: none; border-color: var(--bone); }
button { font: 500 14px/1 var(--font-body); padding: 12px 16px; border-radius: 9px; border: 0; cursor: pointer; background: var(--text); color: var(--bg); }
button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line-strong); }
button:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
.stats { display: flex; flex-wrap: wrap; gap: 12px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; min-width: 150px; }
.stat b { display: block; color: var(--text); font: 500 26px/1.1 var(--font-body); font-variant-numeric: tabular-nums; }
.stat span { font: 500 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 820px; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface); }
td.mono { font: 13px var(--font-mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
td.email { font-family: var(--font-mono); font-size: 13px; color: var(--text); }
.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <div>
    <h1>Waitlist sign-ups</h1>
    <p class="muted">Paste the admin token to see who joined. The token stays in this tab only.</p>
  </div>
  <form class="bar" id="login">
    <input id="token" type="password" autocomplete="off" placeholder="Admin token" aria-label="Admin token">
    <button type="submit">Show sign-ups</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>
  <section id="data" hidden>
    <div class="stats">
      <div class="stat"><b id="total">0</b><span>Total</span></div>
      <div class="stat"><b id="week">0</b><span>Last 7 days</span></div>
      <div class="stat"><b id="today">0</b><span>Last 24 hours</span></div>
    </div>
    <div class="bar" style="margin-block:18px">
      <button type="button" id="refresh" class="ghost">Refresh</button>
      <button type="button" id="csv" class="ghost">Download CSV</button>
      <button type="button" id="logout" class="ghost">Forget token</button>
    </div>
    <div class="wrap">
      <table>
        <thead><tr><th>Joined</th><th>Name</th><th>Email</th><th>Role</th><th>Team</th><th>Agent</th><th>Wants to build</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KEY = 'cadswarm-admin-token';
  let token = '';
  try { token = sessionStorage.getItem(KEY) || ''; } catch (e) {}
  const say = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : 'muted'; };

  async function load() {
    say('Loading…');
    const r = await fetch('/api/waitlist', { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401) { $('data').hidden = true; return say('That token didn’t work. Check it and try again.', true); }
    if (!r.ok) return say('Couldn’t load the list (error ' + r.status + '). Try again.', true);
    const { signups } = await r.json();
    const now = Date.now();
    const age = (s) => now - new Date(s.joinedAt || s.updatedAt).getTime();
    $('total').textContent = signups.length;
    $('week').textContent = signups.filter((s) => age(s) < 7 * 864e5).length;
    $('today').textContent = signups.filter((s) => age(s) < 864e5).length;
    const rows = signups.map((s) => {
      const tr = document.createElement('tr');
      const when = s.joinedAt ? new Date(s.joinedAt).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
      [[when, 'mono'], [s.name], [s.email, 'email'], [s.role], [s.team], [s.agent], [s.build]].forEach(([v, cls]) => {
        const td = document.createElement('td'); td.textContent = v || ''; if (cls) td.className = cls; tr.appendChild(td);
      });
      return tr;
    });
    if (!rows.length) {
      const tr = document.createElement('tr'), td = document.createElement('td');
      td.colSpan = 7; td.className = 'muted'; td.textContent = 'No sign-ups yet. Share the site and they’ll appear here.';
      tr.appendChild(td); rows.push(tr);
    }
    $('rows').replaceChildren(...rows);
    $('data').hidden = false; $('login').hidden = true;
    say('Updated ' + new Date().toLocaleTimeString());
  }

  $('login').addEventListener('submit', (e) => {
    e.preventDefault();
    token = $('token').value.trim();
    try { sessionStorage.setItem(KEY, token); } catch (err) {}
    load().catch(() => say('Couldn’t reach the server.', true));
  });
  $('refresh').addEventListener('click', () => load().catch(() => say('Couldn’t reach the server.', true)));
  $('logout').addEventListener('click', () => {
    token = ''; try { sessionStorage.removeItem(KEY); } catch (e) {}
    $('data').hidden = true; $('login').hidden = false; $('token').value = ''; say('');
  });
  $('csv').addEventListener('click', async () => {
    const r = await fetch('/api/waitlist?format=csv', { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) return say('Couldn’t download the CSV.', true);
    const url = URL.createObjectURL(await r.blob());
    const a = Object.assign(document.createElement('a'), { href: url, download: 'cadswarm-waitlist.csv' });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  if (token) load().catch(() => say('Couldn’t reach the server.', true));
})();
</script>
</body>
</html>
